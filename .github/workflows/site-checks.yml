name: Website checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  irs-news-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the IRS headline parser before it reaches the hourly job
        run: python3 .github/test-irs-news.py
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.10.3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview and check the website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/asg-preview.log 2>&1 &
          node .github/qa.mjs
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-preview-and-qa
          path: .test-results/
          include-hidden-files: true
          retention-days: 14
