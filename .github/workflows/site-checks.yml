name: Website checks
on:
  push:
    branches: [main, codex/modernize-asg-cms, codex/asg-light-bilingual, codex/asg-server-validation, codex/asg-immigration-assistance]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check server validation and parameterized database queries
        env:
          ASG_HTTP_TESTS: '1'
        run: node --test server/test/security.test.mjs
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.10.3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview and check the website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/asg-preview.log 2>&1 &
          node .github/qa.mjs
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-preview-and-qa
          path: .test-results/
          include-hidden-files: true
          retention-days: 14

